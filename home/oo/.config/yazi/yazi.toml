# YAZI config, blazing fast terminal file manager.


[mgr]
  ratio          = [ 3, 7, 10 ]
  scrolloff      = 5
  linemode       = "size"
  sort_by        = "extension"
  sort_fallback  = "alphabetical"
  sort_sensitive = false
  sort_reverse 	 = false
  sort_translit  = false
  sort_dir_first = true
  show_symlink   = false
  show_hidden    = false
  mouse_events   = [ "click", "scroll", "drag" ]
  # title_format   = "Yazi: {cwd}"

[preview]
  wrap            = "no"
  tab_size        = 2
  max_width       = 600
  max_height      = 900
  cache_dir       = ""
  image_filter    = "triangle"
  image_delay     = 100
  image_quality   = 50
  sixel_fraction  = 20
  ueberzug_scale  = 1
  ueberzug_offset = [ 0, 0, 0, 0 ]

[tasks]
  file_workers     = 4
  plugin_workers   = 4
  fetch_workers    = 8
  preload_workers  = 2
  process_workers  = 4
  bizarre_retry    = 2
  image_alloc      = 536870912
  image_bound      = [ 2000, 2000 ]
  suppress_preload = false

[opener]
  editor = [{ run = "nvim       %s", block  = true, for = "linux" },]
  player = [{ run = "mpv        %s", orphan = true, for = "linux" },]
  reader = [{ run = "firefox    %s", orphan = true, for = "linux" },]
  office = [{ run = "onlyoffice %s", orphan = true, for = "linux" },]

  opener = [{ run = "xdg-open %s1", desc = "Opener", for = "linux" },]
	reveal = [{ run = "xdg-open %d1", desc = "Reveal", for = "linux" },]

  extract = [
  	{ run = "ya pub extract --list %s",   desc = "Extract here" },
    ]
  download = [
  	{ run = "ya emit download --open %S", desc = "Download and open" },
  	{ run = "ya emit download %S",        desc = "Download" },
    ]

[open]
  rules = [
	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },

  # media
	{ mime = "text/*"  , use = [ "editor" , "reveal" ] },
	{ mime = "image/*" , use = [ "player" , "reveal" ] },
	{ mime = "audio/*" , use = [ "player" , "reveal" ] },
	{ mime = "video/*" , use = [ "player" , "reveal" ] },
  { url  = "*.txt"   , use = [ "editor" , "reveal" ]},
  { url  = "*.jpg"   , use = [ "player" , "reveal" ]},
  { url  = "*.mp3"   , use = [ "player" , "reveal" ]},
  { url  = "*.mp4"   , use = [ "player" , "reveal" ]},

  # # office
  { url  = "*.pdf"   , use = [ "reader" , "reveal" ]},
  { url  = "*.doc"   , use = [ "office" , "reveal" ]},
  { url  = "*.docx"  , use = [ "office" , "reveal" ]},
  { url  = "*.xls"   , use = [ "office" , "reveal" ]},
  { url  = "*.xlsx"  , use = [ "office" , "reveal" ]},
  { url  = "*.ppt"   , use = [ "office" , "reveal" ]},
  { url  = "*.pptx"  , use = [ "office" , "reveal" ]},

	# Code
	{ mime = "application/{json,ndjson}",       use = [ "editor", "reveal" ] },
	{ mime = "application/{javascript}",        use = [ "editor", "reveal" ] },
	{ mime = "application/{wine-extension-ini}",use = [ "editor", "reveal" ] },

	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },

	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
  ]

[plugin]
  # previewers = [
  prepend_previewers = [

  # image
  	{ url = "*.{jpg,png,gif}",  run = "mpviewer" },
  	{ url = "*.{bmp,tif,tiff}", run = "mpviewer" },

  # audio
  	{ url = "*.{mp3,m4a,aac}",  run = "mpviewer" },
  	{ url = "*.{ogg,wav,flac}", run = "mpviewer" },

  # video
  	{ url = "*.{mp4,m4v,mkv}",  run = "mpviewer" },
  	{ url = "*.{flv,avi,webm}", run = "mpviewer" },

  ]


